[package]
name = "frogboard"
version = "0.1.5"
edition = "2021"
description = "青蛙跳板 Windows desktop workspace"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
rfd = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_UI_Controls_Dialogs"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
